server:
  port: 8080

spring:
  cloud:
    gateway:
      discovery:
        locator:
          enabled: false
      routes:
        - id: product-service-read
          uri: lb://product-service
          predicates:
            - Path=/api/products/**,/api/categories/**
            - Method=GET
          filters:
            - name: Retry
              args:
                retries: 2
                statuses: BAD_GATEWAY,SERVICE_UNAVAILABLE,GATEWAY_TIMEOUT
                series: []
                exceptions: []
                methods: GET
                backoff:
                  firstBackoff: 100ms
                  maxBackoff: 500ms
        - id: inventory-service-read
          uri: lb://inventory-service
          predicates:
            - Path=/api/inventory/**
            - Method=GET
          filters:
            - name: Retry
              args:
                retries: 2
                statuses: BAD_GATEWAY,SERVICE_UNAVAILABLE,GATEWAY_TIMEOUT
                series: []
                exceptions: []
                methods: GET
                backoff:
                  firstBackoff: 100ms
                  maxBackoff: 500ms
        - id: order-service-read
          uri: lb://order-service
          predicates:
            - Path=/api/orders/**
            - Method=GET
          filters:
            - name: Retry
              args:
                retries: 2
                statuses: BAD_GATEWAY,SERVICE_UNAVAILABLE,GATEWAY_TIMEOUT
                series: []
                exceptions: []
                methods: GET
                backoff:
                  firstBackoff: 100ms
                  maxBackoff: 500ms
        - id: product-service-products
          uri: lb://product-service
          predicates:
            - Path=/api/products/**
        - id: product-service-categories
          uri: lb://product-service
          predicates:
            - Path=/api/categories/**
        - id: inventory-service
          uri: lb://inventory-service
          predicates:
            - Path=/api/inventory/**
        - id: order-service
          uri: lb://order-service
          predicates:
            - Path=/api/orders/**
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowed-origins:
              - http://localhost:3000
              - http://localhost:5173
              - http://localhost:8443
            allowed-methods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowed-headers:
              - '*'
            exposed-headers:
              - Location
            allow-credentials: true
            max-age: 3600
